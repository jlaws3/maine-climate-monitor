name: Update Maine Temperature Anomalies
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
permissions:
  contents: write
concurrency:
  group: maine-data-publish
  cancel-in-progress: false
jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip cdsapi xarray numpy pandas netCDF4 shapely pyproj
      - name: Preserve original October 15 reference data
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          data=Path('data')
          summary=data/'summary.json'
          grid=data/'anomalies.geojson'
          if summary.exists() and grid.exists():
              day=json.loads(summary.read_text()).get('date')
              if day:
                  folder=data/'history'/day
                  folder.mkdir(parents=True,exist_ok=True)
                  for name in ('summary.json','anomalies.geojson'):
                      destination=folder/name
                      if not destination.exists():
                          destination.write_bytes((data/name).read_bytes())
                  index=data/'history'/'index.json'
                  dates=json.loads(index.read_text()) if index.exists() else []
                  index.write_text(json.dumps(sorted(set(dates+[day]),reverse=True),indent=2))
          PYCODE
      - name: Download newest available daily data
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDS_API_KEY }}
        run: python download_temperature.py
      - name: Process and validate
        run: |
          python process_climate.py
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('data/anomalies.geojson').read_text())
          s=json.loads(Path('data/summary.json').read_text())
          assert len(g['features'])>=100
          assert len(s['county_statistics'])==16
          assert s['grid_cell_count']==len(g['features'])
          assert s['state_statistics']['area_km2']>0
          print('Validated',s['date'])
          PY
      - name: Publish validated results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/anomalies.geojson data/summary.json data/history/ data/baselines/
          if ! git diff --cached --quiet; then
            git commit -m 'Update Maine daily temperature anomalies'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
